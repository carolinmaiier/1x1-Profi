:root{--blue:#3b82f6;--ink:#23334b;--bg:#dbe7f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:linear-gradient(135deg,#dbe7f1,#f4f7fb);color:var(--ink);font-family:'nekoneko','Trebuchet MS',Arial,sans-serif;text-align:center}.wrap{max-width:650px;margin:auto}h1{font-size:clamp(31px,6vw,49px);margin:14px 0 12px}h2{font-size:25px}p{line-height:1.5}.card{background:white;border-radius:23px;padding:25px 20px;box-shadow:0 16px 34px #27405c18;margin:22px auto}.hidden{display:none!important}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 22px;background:white;box-shadow:0 5px 15px #22334b17;font-size:20px;color:var(--ink)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--blue);color:white}.back{position:absolute;top:14px;left:14px;padding:8px 13px;font-size:26px}.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.choices button{background:#edf4ff;min-width:150px}.muted{color:#64748b}.task{font-size:clamp(40px,10vw,66px);font-weight:800;min-height:110px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.answer{display:inline-block;min-width:74px;border-bottom:5px solid var(--blue);color:var(--blue)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:18px auto}.keypad button{background:#f0f5fc;font-size:28px;font-weight:bold;min-height:63px}.keypad .clear{background:#ffe9e9}.keypad .ok{background:#dcf5e6;color:#146d43}.feedback{height:32px;font-size:20px;font-weight:bold}.progress{font-size:17px;color:#64748b}.dots{display:flex;justify-content:center;gap:9px;margin:15px 0}.dot{width:15px;height:15px;border-radius:50%;background:#d7e2ef}.dot.done{background:#42aa79}.dot.current{background:var(--blue)}.trophy{font-size:74px}.small{font-size:15px;color:#64748b}@media(max-width:420px){.card{padding:18px 12px}.keypad button{min-height:57px}.choices button{width:100%}}
@keyframes confettiFall{0%{transform:translate3d(0,-15vh,0) rotate(0deg);opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(680deg);opacity:0}}.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.confetti-piece{position:absolute;top:-20px;width:10px;height:17px;border-radius:3px;animation:confettiFall var(--duration) ease-in forwards;animation-delay:var(--delay)}.motivation{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#20334a40;z-index:40;padding:20px}.motivation .message{background:#fff;border-radius:24px;padding:35px 28px;box-shadow:0 20px 60px #253d5c35;font-size:clamp(27px,6vw,42px);font-weight:bold;max-width:500px;width:100%;animation:popIn .3s ease-out}@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.confetti-piece{animation-duration:.01ms!important}.motivation .message{animation:none}}
</style></head><body><button id="home" class="back hidden" aria-label="Zum Start">🏠</button><main class="wrap"><h1>⭐ 1×1-Profis ⭐</h1><section id="start" class="card"><h2>Wir werden 1×1-Profis!</h2><div class="choices"><button class="primary" id="go">▶ Los geht's!</button></div></section><section id="play" class="card hidden"><div class="progress" id="counter"></div><div class="dots" id="dots"></div><div class="task"><span id="expression"></span><span>=</span><span id="answer" class="answer">?</span></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="keypad" id="pad"><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="clear" class="clear">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">✓</button></div></section><section id="finish" class="card hidden"><div class="trophy">🏆</div><h2>Geschafft! 🎉</h2><p id="result"></p><div class="choices"><button id="again" class="primary">Noch einmal</button><button id="finishHome">🏠</button></div></section></main><div id="motivation" class="motivation hidden" aria-live="polite"><div id="message" class="message"></div></div><div id="confetti" class="confetti-layer" aria-hidden="true"></div><script>

(()=>{'use strict';
const $=id=>document.getElementById(id);
let deck=[],index=0,step=0,typed='',errors=0,locked=false,runId=0;
let correctStreak=0,errorStreak=0,praiseIndex=0,encourageIndex=0,feedbackBusy=false;
const pool=[],seen=new Set();
function add(a,b){const k=[Math.min(a,b),Math.max(a,b)].join('-');if(!seen.has(k)){seen.add(k);pool.push([a,b]);}}
for(let a=1;a<=10;a++)for(const b of [1,2,5,10])add(a,b);
for(let a=1;a<=10;a++)add(a,a);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function view(id){['start','play','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('home').classList.toggle('hidden',id==='start');}
function begin(){
 deck=shuffle([...pool.filter(([a,b])=>a!==1&&b!==1&&a!==10&&b!==10),
 ...shuffle(pool.filter(([a,b])=>a===1||b===1||a===10||b===10)).slice(0,3)]);
 index=0;step=0;errors=0;correctStreak=0;errorStreak=0;praiseIndex=0;encourageIndex=0;
 runId++;locked=false;feedbackBusy=false;typed='';
 $('motivation').classList.add('hidden');$('confetti').replaceChildren();view('play');render();
}
function family(){
 const [a,b]=deck[index],items=[{text:`${a} × ${b}`,val:a*b},{text:`${a*b} : ${b}`,val:a}];
 if(a!==b&&a!==1&&b!==1&&a!==10&&b!==10)items.push({text:`${a*b} : ${a}`,val:b});
 return items;
}
function current(){return family()[step];}
function render(){
 if(index>=deck.length){rain(100);$('result').textContent=`Du hast ${deck.length} Aufgabenfamilien geübt!`;view('finish');return;}
 $('counter').textContent=`Aufgabenfamilie ${index+1} von ${deck.length}`;
 $('dots').innerHTML=family().map((_,i)=>`<span class="dot ${i<step?'done':i===step?'current':''}"></span>`).join('');
 $('expression').textContent=current().text;$('answer').textContent='?';
 $('feedback').textContent='';$('feedback').style.color='';typed='';locked=false;
}
function rain(n=65){
 const layer=$('confetti');layer.replaceChildren();
 const colors=['#f6c94e','#5ba9e6','#ef83a8','#66c79b','#a899e9','#ff9966'];
 for(let i=0;i<n;i++){const e=document.createElement('span');e.className='confetti-piece';
 e.style.left=Math.random()*100+'%';e.style.background=colors[i%colors.length];
 e.style.setProperty('--drift',(Math.random()*200-100)+'px');
 e.style.setProperty('--duration',(2.2+Math.random()*1.8)+'s');
 e.style.setProperty('--delay',(Math.random()*.65)+'s');layer.appendChild(e);}
 setTimeout(()=>{if(layer.childElementCount===n)layer.replaceChildren();},5000);
}
function popup(message,confetti=false,callback=()=>{}){
 feedbackBusy=true;locked=true;$('message').textContent=message;
 $('motivation').classList.remove('hidden');if(confetti)rain(55);
 const id=runId;
 setTimeout(()=>{if(id!==runId)return;
 $('motivation').classList.add('hidden');feedbackBusy=false;locked=false;callback();
 },confetti?1600:1900);
}
const praise=['Du machst das super! 🌟','Du bist spitze! ⭐','Weiter so! 💪','Du machst das großartig! 🌈','Bärenstark! 🐻'];
const encouragement=['Probier es noch einmal! 🌱','Übung macht den Meister! 💛','Nur nicht aufgeben! 💪','Du wirst immer besser! ⭐','Wir üben weiter! 🌻'];
function advance(){
 step++;if(step===family().length){step=0;index++;}
 if(index>=deck.length){render();return;}
 if(correctStreak>=4){
 correctStreak=0;popup(praise[praiseIndex++%praise.length],true,render);
 }else render();
}
function press(k){
 if(locked||feedbackBusy||$('play').classList.contains('hidden'))return;
 if(k==='clear'){typed=typed.slice(0,-1);$('answer').textContent=typed||'?';return;}
 if(k==='ok'){
  if(!typed)return;
  if(Number(typed)===current().val){
   locked=true;correctStreak++;
   $('feedback').textContent='✓ Richtig!';$('feedback').style.color='#17845c';
   const id=runId;setTimeout(()=>{if(id===runId)advance();},450);
  }else{
   errors++;errorStreak++;correctStreak=0;typed='';$('answer').textContent='?';
   $('feedback').style.color='#c24949';
   const division=current().text.includes(':');
   const [a,b]=deck[index];
   // Help immediately, even when the child usually succeeds on the second attempt.
   // Error count deliberately continues across tasks and is not reset by a correct answer.
   const phrase=encouragement[encourageIndex++%encouragement.length];
   const hint=division?`Tipp: ${a} × ${b} = ${a*b}`:'';
   $('feedback').textContent=hint?`${phrase}  ${hint}`:phrase;
   $('feedback').style.color='#3976a5';
   // A brief additional encouragement after every third error across the session.
   if(errorStreak%3===0){
    popup(errorStreak>=6?'Nur nicht aufgeben! 💪':phrase,false,()=>{
     $('feedback').textContent=hint||'Du schaffst das!';
     $('feedback').style.color='#3976a5';
    });
   }
  }return;
 }
 if(typed.length<3){typed+=k;$('answer').textContent=typed;$('feedback').textContent='';}
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)press(b.dataset.k);});
document.addEventListener('keydown',e=>{if($('play').classList.contains('hidden'))return;
 if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Enter')press('ok');else if(e.key==='Backspace')press('clear');});
$('go').onclick=begin;$('again').onclick=begin;
$('home').onclick=()=>{runId++;$('motivation').classList.add('hidden');$('confetti').replaceChildren();view('start');};
$('finishHome').onclick=()=>{runId++;$('confetti').replaceChildren();view('start');};
})();

</script></body></html>
